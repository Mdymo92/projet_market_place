openapi: 3.1.0
info:
  title: Market Auth API
  version: 1.0.0
  description: |
    Login for Market staff and token issuing for service accounts.
    Access tokens are JWT (HS256), valid 15 minutes, with claims `sub` (user id, never the email), `roles`, `iss`, `exp`.
servers:
  - url: http://localhost:8000
    description: Through the Kong gateway
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: admin

paths:
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Too many attempts (Kong rate limit) }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Get a new access token from a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair (the old refresh token is revoked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/token:
    post:
      tags: [auth]
      summary: Service account token (client credentials)
      description: Used by a service (e.g. orders) to call another service with role service_account.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, examples: ["orders-service"] }
      responses:
        "200":
          description: Access token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/me:
    get:
      tags: [auth]
      summary: Current user and roles
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/users:
    get:
      tags: [admin]
      summary: List users (admin)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Create a user with roles (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Email already used }

  /v1/admin/roles:
    post:
      tags: [admin]
      summary: Assign roles to a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, roles]
              properties:
                user_id: { type: integer }
                roles:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Roles of the user after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Unknown user }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Valid token but the role is not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Role:
      type: string
      enum: [admin, catalog_manager, analyst, logistics, service_account]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    TokenPair:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer, description: Seconds, examples: [900] }
    User:
      type: object
      required: [id, email, roles]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
    UserCreate:
      type: object
      required: [email, password, roles]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        roles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Role" }
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
        request_id: { type: string }
