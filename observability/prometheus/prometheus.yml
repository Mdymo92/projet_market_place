global:
  scrape_interval: 5s        # brief: admin role wants degradation detected in seconds
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8000", "orders:8000", "inventory:8000", "payment:8000", "catalog:8000", "dashboard:8000"]

  - job_name: kong
    static_configs:
      - targets: ["kong:8100"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: spark-streaming
    metrics_path: /metrics/executors/prometheus
    static_configs:
      - targets: ["spark-streaming:4040"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
